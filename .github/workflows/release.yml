name: Release

on:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - name: Package
        run: ./package.sh "${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Breathe-macos
          path: Breathe-*-macos.zip
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Breathe-macos
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "Breathe-$GITHUB_REF_NAME-macos.zip"
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
      - name: Publish to breathe.jcstein.dev/download
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7cd7c5099afe29e7bba04aa0fb64e070
        run: >
          npx --yes wrangler@4 kv key put Breathe-macos.zip --remote
          --namespace-id 7282f6c3a32a4b8c88153b9ded83a4e1
          --path "Breathe-$GITHUB_REF_NAME-macos.zip"
